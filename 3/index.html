<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘星辰塔羅占卜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0d0415 100%);
            color: #e2d1f9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }

        /* 卡牌翻轉動畫與樣式 */
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1 / 1.6;
            margin: 0 auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-container.flipped.reversed .card-inner {
            transform: rotateY(180deg) rotateZ(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-back {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            background-image: radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
        }

        .card-back::before {
            content: '✧';
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        .card-back::after {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 8px;
        }

        .card-front {
            background: #fdfbf7;
            color: #1e1b4b;
            transform: rotateY(180deg);
            padding: 1rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .card-front::after {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid #1e1b4b;
            border-radius: 6px;
            pointer-events: none;
        }

        .card-suit-icon {
            font-size: 3rem;
            margin: 1rem 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* 呼吸燈特效 */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.7); }
        }
        
        .glow-effect {
            animation: pulse-glow 2s infinite;
        }

        /* 星星背景特效 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0415; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4c1d95; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d28d9; 
        }

        .markdown-body strong {
            color: #d4af37;
            font-weight: 600;
        }
        .markdown-body h3 {
            color: #d4af37;
            font-size: 1.25rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 0.25rem;
        }
        .markdown-body p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }
    </style>
</head>
<body class="relative flex flex-col items-center p-6 md:p-12">
    <div class="stars"></div>

    <header class="text-center mb-12 w-full max-w-4xl mx-auto z-10">
        <h1 class="title-font text-4xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-yellow-700 font-bold mb-4 drop-shadow-lg">
            神秘星辰塔羅
        </h1>
        <p class="text-lg md:text-xl text-purple-200 opacity-80 tracking-widest">探索過去，洞悉現在，啟示未來</p>
    </header>

    <main class="w-full max-w-5xl mx-auto flex flex-col items-center z-10">
        
        <!-- 抽牌按鈕區 -->
        <div id="action-area" class="mb-12">
            <button id="draw-btn" onclick="startReading()" class="title-font relative px-8 py-4 bg-gradient-to-b from-purple-800 to-indigo-900 border-2 border-yellow-500 rounded-full text-yellow-400 text-xl font-bold tracking-widest uppercase hover:scale-105 transition-transform duration-300 shadow-[0_0_20px_rgba(212,175,55,0.4)] hover:shadow-[0_0_30px_rgba(212,175,55,0.6)]">
                抽取三張牌 (過去・現在・未來)
            </button>
        </div>

        <!-- 狀態提示 -->
        <div id="status-msg" class="h-8 mb-6 text-yellow-300 text-lg tracking-wider opacity-0 transition-opacity duration-500">
            正在與宇宙意識連結...
        </div>

        <!-- 卡牌展示區 -->
        <div id="cards-area" class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-12 w-full mb-12 hidden">
            <!-- 牌 1: 過去 -->
            <div class="flex flex-col items-center">
                <h3 class="title-font text-yellow-500 mb-4 text-xl font-semibold tracking-widest drop-shadow-md">過 去</h3>
                <div id="card-1" class="card-container">
                    <div class="card-inner">
                        <div class="card-back glow-effect"></div>
                        <div class="card-front">
                            <span class="text-xs uppercase tracking-widest text-gray-500 mb-1" id="type-1">Arcana</span>
                            <h4 class="title-font text-lg font-bold text-center leading-tight mb-2" id="name-1">The Fool</h4>
                            <div class="card-suit-icon" id="icon-1">🔮</div>
                            <span class="text-sm font-semibold text-red-700 hidden mt-auto" id="rev-1">逆位 (Reversed)</span>
                            <span class="text-sm font-semibold text-green-700 hidden mt-auto" id="up-1">正位 (Upright)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 牌 2: 現在 -->
            <div class="flex flex-col items-center">
                <h3 class="title-font text-yellow-500 mb-4 text-xl font-semibold tracking-widest drop-shadow-md">現 在</h3>
                <div id="card-2" class="card-container">
                    <div class="card-inner">
                        <div class="card-back glow-effect"></div>
                        <div class="card-front">
                            <span class="text-xs uppercase tracking-widest text-gray-500 mb-1" id="type-2">Arcana</span>
                            <h4 class="title-font text-lg font-bold text-center leading-tight mb-2" id="name-2">The Magician</h4>
                            <div class="card-suit-icon" id="icon-2">🪄</div>
                            <span class="text-sm font-semibold text-red-700 hidden mt-auto" id="rev-2">逆位 (Reversed)</span>
                            <span class="text-sm font-semibold text-green-700 hidden mt-auto" id="up-2">正位 (Upright)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 牌 3: 未來 -->
            <div class="flex flex-col items-center">
                <h3 class="title-font text-yellow-500 mb-4 text-xl font-semibold tracking-widest drop-shadow-md">未 來</h3>
                <div id="card-3" class="card-container">
                    <div class="card-inner">
                        <div class="card-back glow-effect"></div>
                        <div class="card-front">
                            <span class="text-xs uppercase tracking-widest text-gray-500 mb-1" id="type-3">Arcana</span>
                            <h4 class="title-font text-lg font-bold text-center leading-tight mb-2" id="name-3">The High Priestess</h4>
                            <div class="card-suit-icon" id="icon-3">🏆</div>
                            <span class="text-sm font-semibold text-red-700 hidden mt-auto" id="rev-3">逆位 (Reversed)</span>
                            <span class="text-sm font-semibold text-green-700 hidden mt-auto" id="up-3">正位 (Upright)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 解牌結果區 -->
        <div id="reading-area" class="w-full max-w-3xl bg-[#1e1b4b]/80 backdrop-blur-md border border-purple-500/50 rounded-2xl p-8 md:p-10 shadow-2xl hidden opacity-0 transition-opacity duration-1000">
            <h2 class="title-font text-2xl md:text-3xl text-yellow-400 text-center mb-6 border-b border-purple-500/50 pb-4">星辰啟示錄</h2>
            <div id="reading-content" class="markdown-body text-purple-100 text-lg leading-relaxed">
                <!-- Gemini 產生的解牌將呈現在這裡 -->
            </div>
            <div class="text-center mt-10">
                <button onclick="resetReading()" class="px-6 py-2 bg-transparent border border-purple-400 text-purple-300 rounded-full hover:bg-purple-800/50 transition-colors">
                    重新占卜
                </button>
            </div>
        </div>

    </main>

    <script>
        // 對應塔羅牌種類的 Emoji 圖示
        const suitIcons = {
            'wands': '🪄',
            'cups': '🏆',
            'swords': '⚔️',
            'pentacles': '🪙',
            'major': '🔮'
        };

        let drawnCards = [];

        // 簡單的 Markdown 轉 HTML 解析器 (針對 Gemini 輸出)
        function parseMarkdown(md) {
            let html = md;
            // 標題 3
            html = html.replace(/### (.*?)\n/g, '<h3>$1</h3>');
            // 標題 2
            html = html.replace(/## (.*?)\n/g, '<h3 style="font-size: 1.4rem;">$1</h3>');
            // 粗體
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // 換行
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            return `<p>${html}</p>`;
        }

        function setStatus(msg, show) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.style.opacity = show ? '1' : '0';
        }

        async function startReading() {
            // UI 狀態重置
            document.getElementById('action-area').classList.add('hidden');
            document.getElementById('reading-area').classList.add('hidden');
            document.getElementById('reading-area').classList.remove('opacity-100');
            
            const cardsArea = document.getElementById('cards-area');
            cardsArea.classList.remove('hidden');
            
            // 重置卡牌背面
            for(let i=1; i<=3; i++) {
                const card = document.getElementById(`card-${i}`);
                card.className = 'card-container'; // 移除 flipped 和 reversed
            }

            setStatus('正在感應塔羅牌的能量...', true);

            try {
                // 1. 調用外部 Tarot API 獲取 3 張隨機牌
                const response = await fetch('https://tarotapi.dev/api/v1/cards/random?n=3');
                if (!response.ok) throw new Error('API 請求失敗');
                const data = await response.json();
                
                drawnCards = data.cards.map(card => {
                    // 隨機決定正逆位 (50% 機率)
                    const isReversed = Math.random() > 0.5;
                    return {
                        ...card,
                        isReversed,
                        orientationStr: isReversed ? '逆位' : '正位'
                    };
                });

                // 2. 渲染卡牌內容並逐一翻牌
                renderCards(drawnCards);
                
                await new Promise(r => setTimeout(r, 1000));
                
                for(let i=0; i<3; i++) {
                    flipCard(i + 1, drawnCards[i].isReversed);
                    await new Promise(r => setTimeout(r, 800)); // 翻牌間隔
                }

                // 3. 調用 Gemini API 進行解牌
                setStatus('牌陣已成，正在祈求星辰智慧進行解讀...', true);
                await generateReading(drawnCards);

            } catch (error) {
                console.error("Error:", error);
                setStatus('占卜過程受到干擾，請稍後再試。', true);
                document.getElementById('action-area').classList.remove('hidden');
            }
        }

        function renderCards(cards) {
            cards.forEach((card, index) => {
                const i = index + 1;
                const suitType = card.type === 'major' ? 'major' : card.suit;
                
                document.getElementById(`name-${i}`).textContent = card.name;
                document.getElementById(`type-${i}`).textContent = card.type === 'major' ? 'Major Arcana' : `Minor Arcana - ${card.suit}`;
                document.getElementById(`icon-${i}`).textContent = suitIcons[suitType] || '✨';
                
                // 設定正逆位文字顯示
                const revEl = document.getElementById(`rev-${i}`);
                const upEl = document.getElementById(`up-${i}`);
                if (card.isReversed) {
                    revEl.classList.remove('hidden');
                    upEl.classList.add('hidden');
                } else {
                    upEl.classList.remove('hidden');
                    revEl.classList.add('hidden');
                }
            });
        }

        function flipCard(index, isReversed) {
            const cardEl = document.getElementById(`card-${index}`);
            // 先移除發光特效
            cardEl.querySelector('.card-back').classList.remove('glow-effect');
            
            // 加入翻轉動畫
            let classes = ['flipped'];
            if (isReversed) classes.push('reversed');
            cardEl.classList.add(...classes);
        }

        async function generateReading(cards) {
            // 準備給 Gemini 的提示詞
            const systemPrompt = `你是一位神秘、深具同理心且智慧的塔羅占卜大師。請使用優美、富有詩意及神秘感的繁體中文(台灣用語)來進行解牌。
解牌結構如下：
1. 開場白（簡短的神秘問候）。
2. 【過去】：分析第一張牌（包含正逆位）在過去的影響。
3. 【現在】：分析第二張牌（包含正逆位）在目前的處境。
4. 【未來】：分析第三張牌（包含正逆位）對未來的指引。
5. 【綜合啟示】：將三張牌串聯，給予求問者一個溫暖且具啟發性的最終建議。

請排版清晰，使用 Markdown 標題 (###) 與粗體來標示重點。不要重複敘述卡牌的英文名字，直接專注於意境和解讀。`;

            const userQuery = `求問者抽出的牌陣如下：
1. 過去：${cards[0].name} (${cards[0].orientationStr})
2. 現在：${cards[1].name} (${cards[1].orientationStr})
3. 未來：${cards[2].name} (${cards[2].orientationStr})

請開始你的解讀。`;

            const apiKey = ""; // Canvas 執行環境會自動帶入 API Key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                // 指數退避重試邏輯處理 API 限制
                let response;
                let retries = 3;
                let delay = 1000;
                
                while (retries > 0) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) break;
                    retries--;
                    if (retries === 0) throw new Error('API Rate Limit or Error');
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    displayReading(text);
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                document.getElementById('reading-content').innerHTML = "<p class='text-red-400'>星辰的訊號暫時被迷霧遮蔽，無法解讀牌意。請稍後重新占卜。</p>";
                showReadingArea();
            }
        }

        function displayReading(markdownText) {
            setStatus('', false);
            const contentEl = document.getElementById('reading-content');
            contentEl.innerHTML = parseMarkdown(markdownText);
            showReadingArea();
        }

        function showReadingArea() {
            const readingArea = document.getElementById('reading-area');
            readingArea.classList.remove('hidden');
            // 延遲一點點讓 display: block 生效後再加透明度動畫
            setTimeout(() => {
                readingArea.classList.add('opacity-100');
                readingArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function resetReading() {
            document.getElementById('reading-area').classList.add('hidden');
            document.getElementById('reading-area').classList.remove('opacity-100');
            document.getElementById('cards-area').classList.add('hidden');
            
            // 恢復按鈕
            document.getElementById('action-area').classList.remove('hidden');
            setStatus('', false);
            
            // 卡牌特效復原
            for(let i=1; i<=3; i++) {
                const cardEl = document.getElementById(`card-${i}`);
                cardEl.querySelector('.card-back').classList.add('glow-effect');
                cardEl.className = 'card-container';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
